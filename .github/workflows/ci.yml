name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: daemon/go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/whatsapp-axid ./cmd/whatsapp-axid

      - name: Build for macOS (CGO disabled)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/whatsapp-axid

      - name: Test
        run: go test -race ./...

      - name: Test (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  cli:
    name: CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: daemon/go.sum

      - name: Build the daemon for the end-to-end test
        working-directory: daemon
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/whatsapp-axid ./cmd/whatsapp-axid

      - name: Test
        run: npm test
