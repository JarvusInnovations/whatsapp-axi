name: CI

# Also the publish gate: publish-npm.yml calls this workflow at the release tag with the release
# version, so a release runs exactly these checks. Every job stamps a version into package.json
# before building, as a release does: the release version there, 0.0.0-ci on a push or pull
# request. Neither is the placeholder in package.json, so nothing can pass only because the
# version happens to equal it.
on:
  workflow_call:
    inputs:
      version:
        description: The version to stamp, from the release tag (vX.Y.Z without the v)
        required: true
        type: string
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # edited: a stacked PR that is retargeted is checked against its new base.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  STAMP_VERSION: ${{ inputs.version || '0.0.0-ci' }}

jobs:
  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: daemon/go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/whatsapp-axid ./cmd/whatsapp-axid

      - name: Build for macOS (CGO disabled)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/whatsapp-axid

      - name: Test
        run: go test -race ./...

      - name: Test (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  cli:
    name: CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Stamp the version
        run: npm version --no-git-tag-version --allow-same-version "$STAMP_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: The skill is current with the command reference
        run: bun run docs:check

      - name: The built CLI reports the stamped version
        run: test "$(node dist/bin/whatsapp-axi.js --version)" = "$STAMP_VERSION"

      - name: Smoke test the built CLI with no account and no daemon
        # --version and --help never reach dispatch. A real command with no account must give a
        # structured error with its code and exit status, never a crash or a stack trace.
        run: |
          set +e
          tmp=$(mktemp -d)
          export HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" XDG_STATE_HOME="$tmp/state" XDG_DATA_HOME="$tmp/data" XDG_RUNTIME_DIR="$tmp/run"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          node dist/bin/whatsapp-axi.js --version
          out=$(node dist/bin/whatsapp-axi.js chats 2>&1); code=$?
          echo "$out"
          if [ "$code" -ne 1 ]; then echo "::error::chats: expected exit 1, got $code"; exit 1; fi
          if ! echo "$out" | grep -q '^code: NO_ACCOUNT$'; then echo "::error::chats: expected code NO_ACCOUNT"; exit 1; fi
          out2=$(node dist/bin/whatsapp-axi.js chats --bogus 2>&1); code2=$?
          echo "$out2"
          if [ "$code2" -ne 2 ]; then echo "::error::chats --bogus: expected exit 2, got $code2"; exit 1; fi
          if ! echo "$out2" | grep -q '^code: UNKNOWN_FLAG$'; then echo "::error::chats --bogus: expected code UNKNOWN_FLAG"; exit 1; fi
          home=$(node dist/bin/whatsapp-axi.js 2>&1); code3=$?
          if [ "$code3" -ne 0 ]; then echo "::error::home: expected exit 0, got $code3"; exit 1; fi
          if echo "$out$out2$home" | grep -qE '^\s+at |node:internal'; then echo "::error::a stack trace reached the output"; exit 1; fi
          echo "smoke test passed"

      - name: Scrub gate (public repository)
        run: bun run check:scrub

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: daemon/go.sum

      - name: Build the daemon for the end-to-end test
        run: bun run build:daemon

      - name: Test
        run: bun run test

  packages:
    name: Packages (licences, cross-compile, installed smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: daemon/go.sum

      - name: Stamp the version
        run: npm version --no-git-tag-version --allow-same-version "$STAMP_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the CLI
        run: bun run build

      - name: Licence gate (every compiled-in dependency is on daemon/licenses-allowed.json)
        run: bun run check:licenses

      - name: Cross-compile all four targets and assemble the five packages
        run: bun run build:packages

      - name: Pack each package (dry run)
        run: |
          set -euo pipefail
          for d in release/*/; do
            echo "::group::$d"
            (cd "$d" && npm pack --dry-run)
            echo "::endgroup::"
          done

      # Installs the packed main package and the runner's platform package from local tarballs into
      # a temp prefix, at a version no registry has, so the daemon the CLI finds can only be the one
      # packed here. Then runs the installed CLI against a temp home.
      - name: Smoke test the installed package
        run: |
          set -euo pipefail
          version=0.0.0-ci
          target=$(node -p 'process.platform + "-" + process.arch')
          tmp=$(mktemp -d)
          node scripts/build-packages.mjs --out "$tmp/pkgs" --version "$version" --only "$target"
          mkdir "$tmp/tgz"
          for p in whatsapp-axi "whatsapp-axi-$target"; do (cd "$tmp/pkgs/$p" && npm pack --pack-destination "$tmp/tgz"); done
          npm install -g --prefix "$tmp/prefix" --no-audit --no-fund "$tmp/tgz/whatsapp-axi-$version.tgz" "$tmp/tgz/whatsapp-axi-$target-$version.tgz"
          export PATH="$tmp/prefix/bin:$PATH" HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" XDG_STATE_HOME="$tmp/state" XDG_DATA_HOME="$tmp/data" XDG_RUNTIME_DIR="$tmp/run" WHATSAPP_AXI_DISABLE_HOOKS=1
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          cd "$tmp"
          test "$(command -v whatsapp-axi)" = "$tmp/prefix/bin/whatsapp-axi"
          got=$(whatsapp-axi --version)
          if [ "$got" != "$version" ]; then echo "::error::--version printed $got, not $version"; exit 1; fi
          set +e
          doctor=$(whatsapp-axi doctor 2>&1); c1=$?
          add=$(whatsapp-axi account add example 2>&1); c2=$?
          plan=$(whatsapp-axi daemon install example --dry-run 2>&1); c3=$?
          set -e
          printf '%s\n---\n%s\n---\n%s\n' "$doctor" "$add" "$plan"
          if [ "$c1" -ne 0 ]; then echo "::error::doctor with no accounts: exit $c1"; exit 1; fi
          if [ "$c2" -ne 0 ] || ! echo "$add" | grep -q '^action: created$'; then echo "::error::account add example failed: the CLI did not run the installed daemon"; exit 1; fi
          if [ ! -d "$XDG_CONFIG_HOME/whatsapp-axi/accounts/example" ]; then echo "::error::account add created no account directory"; exit 1; fi
          if [ "$c3" -ne 0 ] || ! echo "$plan" | grep -q "from: $tmp/prefix/lib/node_modules/whatsapp-axi-$target/bin/whatsapp-axid"; then echo "::error::daemon install would not copy the installed platform package's binary"; exit 1; fi
          if echo "$doctor$add$plan" | grep -qE '^\s+at |node:internal'; then echo "::error::a stack trace reached the output"; exit 1; fi
          echo "installed-package smoke test passed"
